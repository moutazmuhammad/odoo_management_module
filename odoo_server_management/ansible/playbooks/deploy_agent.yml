---
# Install the shell self-backup agent (backup_agent.sh) + a daily Linux cron on
# a managed server. The S3 credentials ARE written here (root-only 0600 s3cfg,
# rendered per-host by the manager) so the server uploads its own backups with
# s3cmd — no pre-signed-URL round-trip to the manager on every run.
- hosts: all
  gather_facts: no
  become: yes
  tasks:
    - name: Create agent directory
      file:
        path: /opt/odoo-backup
        state: directory
        mode: '0755'

    - name: Install detection/dump helper
      copy:
        src: files/smart_backup.py
        dest: /opt/odoo-backup/smart_backup.py
        mode: '0755'

    - name: Install shell backup agent (with per-host S3 config baked in)
      template:
        src: files/backup_agent.sh.j2
        dest: /opt/odoo-backup/backup_agent.sh
        owner: root
        group: root
        mode: '0700'

    - name: Remove the legacy Python agent + its config (superseded by the shell agent)
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/odoo-backup/agent.py
        - /etc/odoo-backup.conf

    - name: Install daily cron
      copy:
        dest: /etc/cron.d/odoo-backup
        mode: '0644'
        content: |
          # Odoo self-backup agent — daily at {{ '%02d'|format(backup_hour|int) }}:{{ '%02d'|format(jitter|int) }} (server time)
          SHELL=/bin/bash
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          {{ jitter|int }} {{ backup_hour|int }} * * * root /opt/odoo-backup/backup_agent.sh >> /var/log/odoo-backup.log 2>&1

    - name: Rotate the agent log so it never grows unbounded
      copy:
        dest: /etc/logrotate.d/odoo-backup
        mode: '0644'
        content: |
          /var/log/odoo-backup.log {
              daily
              rotate 2
              compress
              missingok
              notifempty
              copytruncate
          }

    - name: Report
      debug:
        msg: "shell agent installed; daily at {{ backup_hour }}:{{ jitter }}"
